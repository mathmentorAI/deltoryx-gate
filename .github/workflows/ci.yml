name: Gate engineering contracts
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    name: Current package and source contracts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q
  package:
    name: Installed wheel contains only the current surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Check wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/gate-wheel-env"
          "$RUNNER_TEMP/gate-wheel-env/bin/python" -m pip install dist/*.whl pytest
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/gate-wheel-env/bin/python" -I -m pytest -c /dev/null -p no:cacheprovider --import-mode=importlib "$GITHUB_WORKSPACE/tests" -q
