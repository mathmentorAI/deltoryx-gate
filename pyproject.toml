[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deltoryx-gate"
version = "4.0.0"
description = "Deterministic verification & authorization harness for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "LicenseRef-ClaimLayer-BSL-1.1"}
authors = [
  {name = "Deltoryx"}
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.scripts]
deltoryx-gate = "claimlayer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
